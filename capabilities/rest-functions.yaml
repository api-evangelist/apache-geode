naftiko: 1.0.0-alpha2
info:
  label: Apache Geode REST API — Functions
  description: 'Apache Geode REST API — Functions. 2 operations. Lead operation: Apache Geode List Available Functions. Self-contained
    Naftiko capability covering one Apache Geode business surface.'
  tags:
  - Apache Geode
  - Functions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_GEODE_API_KEY: APACHE_GEODE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-functions
    baseUri: http://localhost:8080
    description: Apache Geode REST API — Functions business capability. Self-contained, no shared references.
    resources:
    - name: geode-v1-functions
      path: /geode/v1/functions
      operations:
      - name: listfunctions
        method: GET
        description: Apache Geode List Available Functions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: geode-v1-functions-functionId
      path: /geode/v1/functions/{functionId}
      operations:
      - name: executefunction
        method: POST
        description: Apache Geode Execute Server Function
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: functionId
          in: path
          type: string
          description: The ID of the function to execute
          required: true
        - name: onRegion
          in: query
          type: string
          description: Execute function on a specific region
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: rest-functions-rest
    port: 8080
    description: REST adapter for Apache Geode REST API — Functions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/geode/v1/functions
      name: geode-v1-functions
      description: REST surface for geode-v1-functions.
      operations:
      - method: GET
        name: listfunctions
        description: Apache Geode List Available Functions
        call: rest-functions.listfunctions
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/geode/v1/functions/{functionid}
      name: geode-v1-functions-functionid
      description: REST surface for geode-v1-functions-functionId.
      operations:
      - method: POST
        name: executefunction
        description: Apache Geode Execute Server Function
        call: rest-functions.executefunction
        with:
          functionId: rest.functionId
          onRegion: rest.onRegion
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-functions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Geode REST API — Functions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: apache-geode-list-available-functions
      description: Apache Geode List Available Functions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-functions.listfunctions
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-geode-execute-server-function
      description: Apache Geode Execute Server Function
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-functions.executefunction
      with:
        functionId: tools.functionId
        onRegion: tools.onRegion
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
